name: Zynk Build & Release Pipeline

on:
  push:
    tags:
      - 'v*' 

jobs:
  build-linux:
    name: Build Linux (Makefile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Clean previous builds
        run: make clean

      - name: Create build directories
        run: mkdir -p build lib

      - name: Compile with Make
        run: make

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zynk-linux-binaries
          path: build/zynk

  build-windows:
    name: Build Windows Cross-Compile (Makefile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Clean previous builds
        run: make clean

      - name: Create build directories
        run: mkdir -p build lib

      - name: Compile with Make for Windows
        run: make OS=windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zynk-windows-binaries
          path: build/zynk.exe

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') 
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: zynk-linux-binaries
          path: artifacts/linux

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: zynk-windows-binaries
          path: artifacts/windows

      - name: Crear Release y subir ejecutables
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/zynk
            artifacts/windows/zynk.exe
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
